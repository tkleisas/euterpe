<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="256" height="256">
  <defs>
    <radialGradient id="bgGlow" cx="54" cy="54" r="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A2238"/>
      <stop offset="100%" stop-color="#0E111A"/>
    </radialGradient>
  </defs>
  <rect width="108" height="108" rx="24" fill="url(#bgGlow)"/>
  <!-- Moon behind: 3/4 dark disc -->
  <circle cx="54" cy="54" r="31" fill="#1C2541" stroke="#2E3B63" stroke-width="1.2"/>
  <!-- Moon 1/4 lit waxing crescent (Lua reference) -->
  <path d="M54,23 A31,31 0 0,1 54,85 A16,31 0 0,0 54,23 Z" fill="#F4E3B2"/>
  <!-- Subtle orbital dot -->
  <circle cx="79" cy="29.2" r="3.2" fill="#E8B959"/>
  <!-- Lyre crossbar -->
  <line x1="34" y1="37" x2="74" y2="37" stroke="#E8B959" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Lyre curved arms -->
  <path d="M39,34 C33,44 33,61 42,71 C46,75 50,77 54,77 C58,77 62,75 66,71 C75,61 75,44 69,34"
        fill="none" stroke="#E8B959" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lyre soundbox -->
  <path d="M42,68 L66,68 C66,75 61,79 54,79 C47,79 42,75 42,68 Z"
        fill="#C99438" stroke="#F4D37E" stroke-width="1.4"/>
  <!-- Exactly 4 taut vertical strings -->
  <line x1="46.5" y1="37" x2="46.5" y2="68" stroke="#FFF5D6" stroke-width="1.4"/>
  <line x1="51.5" y1="37" x2="51.5" y2="68" stroke="#FFF5D6" stroke-width="1.4"/>
  <line x1="56.5" y1="37" x2="56.5" y2="68" stroke="#FFF5D6" stroke-width="1.4"/>
  <line x1="61.5" y1="37" x2="61.5" y2="68" stroke="#FFF5D6" stroke-width="1.4"/>
</svg>
