name: Android CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK not found at $SDK_ROOT"
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Native C++ DSP & Lua tests
        run: |
          chmod +x native-tests/run.sh scripts/check_16kb_page_size.sh gradlew
          ./native-tests/run.sh

      - name: Test, lint, and build debug APK
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Euterpe-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Decode release keystore (if configured)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/euterpe-release.p12"
            test -s "$RUNNER_TEMP/euterpe-release.p12"
            echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"
          else
            echo "::notice::RELEASE_KEYSTORE_BASE64 not set; building unsigned release APK/AAB"
            echo "HAS_KEYSTORE=false" >> "$GITHUB_ENV"
          fi

      - name: Build release APK and AAB (R8 full mode)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_PATH: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/euterpe-release.p12', runner.temp) || '' }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
          if [ "$HAS_KEYSTORE" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "Euterpe-${GITHUB_REF_NAME}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "Euterpe-${GITHUB_REF_NAME}.aab"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "Euterpe-${GITHUB_REF_NAME}.apk"
            "$JAVA_HOME/bin/jarsigner" -verify "Euterpe-${GITHUB_REF_NAME}.aab" > /dev/null
          else
            cp app/build/outputs/apk/release/app-release-unsigned.apk "Euterpe-${GITHUB_REF_NAME}.apk"
            cp app/build/outputs/bundle/release/app-release.aab "Euterpe-${GITHUB_REF_NAME}.aab"
          fi

      - name: Verify 16 KB page size support
        if: startsWith(github.ref, 'refs/tags/v')
        run: ./scripts/check_16kb_page_size.sh "Euterpe-${GITHUB_REF_NAME}.apk" "Euterpe-${GITHUB_REF_NAME}.aab"

      - name: Upload release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Euterpe-${{ github.ref_name }}
          path: |
            Euterpe-${{ github.ref_name }}.apk
            Euterpe-${{ github.ref_name }}.aab
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Euterpe-${{ github.ref_name }}.apk
            Euterpe-${{ github.ref_name }}.aab
          generate_release_notes: true
